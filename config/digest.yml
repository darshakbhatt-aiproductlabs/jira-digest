# =============================================================================
# jira-digest — configuration
#
# Everything that varies between users lives here. The script itself stays
# generic. Edit this file (or have an LLM populate it from the README handoff
# prompt) and you're done.
#
# Format: YAML. Comments start with #.
# Reference: https://github.com/<your-org>/jira-digest#config-schema
# =============================================================================

# -----------------------------------------------------------------------------
# 1. JIRA CONNECTION
# -----------------------------------------------------------------------------
jira:
  # Base URL of your Jira Cloud instance. Pulled from env so it can stay out of git.
  base_url_env: JIRA_BASE_URL          # e.g. https://your-domain.atlassian.net

  # One or more project keys. Found in the URL when viewing a project board.
  project_keys: [PROJ]

  # Optional global filter — applied to every section's JQL via AND clause.
  # Leave empty string to disable. Useful to scope to a single issuetype.
  global_jql: ""

  # Page size for Jira's /search/jql endpoint (max 100).
  page_size: 100

  # Per-request timeout in seconds.
  request_timeout: 30

# -----------------------------------------------------------------------------
# 2. CUSTOM FIELD ALIASES
# -----------------------------------------------------------------------------
# Give your custom fields human-readable names. The script substitutes the
# alias with the underlying customfield_XXXXX wherever it appears in a JQL
# string, a column reference, or a group_by clause.
#
# How to discover your custom field IDs:
#   curl -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
#        "$JIRA_BASE_URL/rest/api/3/field" | jq '.[] | {id, name}'
#
# Leave the map empty if you only use standard Jira fields.
fields:
  aliases: {}
    # Example shape (uncomment + fill if you have custom fields):
    # customer_account: customfield_XXXXX
    # deal_amount:      customfield_XXXXX
    # severity:         customfield_XXXXX

# -----------------------------------------------------------------------------
# 3. STATUS GROUPS
# -----------------------------------------------------------------------------
# Used by stuck/aging/status_breakdown sections. Match the EXACT status names
# in your Jira workflow (case-sensitive).
statuses:
  active:
    - "Open"
    - "To Do"
    - "In Progress"
    - "In Review"
  done:
    - "Done"
    - "Closed"
    - "Resolved"

# -----------------------------------------------------------------------------
# 4. SECTIONS
# -----------------------------------------------------------------------------
# Each section produces one block in the rendered digest. They run in the
# order listed. Supported section types:
#
#   list             — table of issues matching JQL
#   kpi              — row of counters; each item is a JQL count
#   status_breakdown — count of issues per status (uses statuses.active)
#   stuck            — issues with no status change in N days
#   recent           — issues created/updated in last N hours/days
#   group_by         — count + sample issues grouped by a field
#
# Placeholders available in JQL strings:
#   {project_keys}   — expands to "PROJ1","PROJ2" suitable for IN ()
#   {date}           — today's date (YYYY-MM-DD) in configured timezone
#
# Custom field aliases are also substituted in JQL — write `customer_account`
# and the script swaps in `customfield_XXXXX`.
# -----------------------------------------------------------------------------
sections:
  - id: kpis
    type: kpi
    title: "Key metrics"
    metrics:
      - label: "Open"
        jql: 'project IN ({project_keys}) AND statusCategory != Done'
      - label: "New (7d)"
        jql: 'project IN ({project_keys}) AND created >= -7d'
      - label: "Closed (7d)"
        jql: 'project IN ({project_keys}) AND resolved >= -7d'

  - id: open_critical
    type: list
    title: "Open critical & high-priority"
    jql: 'project IN ({project_keys}) AND priority IN (Highest, High) AND statusCategory != Done'
    columns: [key, summary, assignee, priority, status, days_in_status]
    sort: { by: days_in_status, dir: desc }
    limit: 25
    empty_message: "No critical items open."

  - id: status_summary
    type: status_breakdown
    title: "Status breakdown"
    jql: 'project IN ({project_keys}) AND statusCategory != Done'

  - id: stuck_items
    type: stuck
    title: "Stuck — no status change in 30+ days"
    jql: 'project IN ({project_keys}) AND statusCategory != Done'
    threshold_days: 30
    columns: [key, summary, status, days_in_status, assignee]
    sort: { by: days_in_status, dir: desc }
    limit: 20

  - id: new_today
    type: recent
    title: "Created in last 24 hours"
    jql: 'project IN ({project_keys}) AND created >= -24h'
    columns: [key, summary, reporter, priority]
    limit: 20
    empty_message: "Nothing new since yesterday."

  # Example of a group_by section using a custom field alias.
  # Uncomment and adapt after defining the alias under fields.aliases above.
  #
  # - id: by_customer
  #   type: group_by
  #   title: "By customer account"
  #   jql: 'project IN ({project_keys}) AND statusCategory != Done AND customer_account IS NOT EMPTY'
  #   group_by: customer_account
  #   show: [count, sample]
  #   sample_size: 3
  #   sort: { by: count, dir: desc }
  #   limit: 10

# -----------------------------------------------------------------------------
# 5. DELIVERY
# -----------------------------------------------------------------------------
# Enable any combination of channels. Each enabled channel needs its secrets
# set (see .env.example). The script renders once and pushes to all enabled
# channels in parallel.
# -----------------------------------------------------------------------------
delivery:
  email:
    enabled: true
    # Provider: gmail (creates a Gmail draft) | smtp (sends immediately)
    via: gmail
    # Sender address for SMTP. For Gmail this is ignored — the authenticated
    # account is used.
    from: ""
    to:
      - you@example.com
    cc: []
    subject: "Jira digest — {date}"
    # gmail-only: create a draft instead of sending. Recommended while you
    # tune the digest content. Set to false to auto-send.
    gmail_draft_mode: true

  slack:
    enabled: false
    # via: bot uses Block Kit + SLACK_BOT_TOKEN. webhook uses SLACK_WEBHOOK_URL
    # (simpler setup, no app install, but plainer formatting).
    via: bot
    channel_id: ""        # required if via=bot. e.g. C0123456789
    title: "Jira digest — {date}"

  teams:
    enabled: false
    title: "Jira digest — {date}"

  # Browser-hosted full HTML via GitHub gist (+ htmlpreview.github.io).
  #
  # Slack and Teams messages are capped — Slack truncates after ~50 blocks
  # (≈ 4-6 sections), Teams similarly. When this is enabled, every Slack /
  # Teams message gets a "📄 View full digest in browser" link to a gist
  # rendering of the complete digest. Each day = a new gist with its own
  # permanent URL, so a Slack link from last week still shows last week's
  # digest, not today's.
  #
  # ⚠ PRIVACY:
  #   public: true  → gist appears on your GitHub profile, indexed by search.
  #   public: false → "secret" gist: NOT listed, NOT searchable, but anyone
  #                   with the URL can read it (no auth). That's normal for
  #                   chat-link sharing — the URL is only known by people in
  #                   the channel — and is the recommended default.
  #
  # SETUP (one-time, only if enabling):
  #   1. Create a fine-grained personal access token at
  #      https://github.com/settings/tokens?type=beta with ONLY the "gist"
  #      scope. No other permissions needed.
  #   2. Add it as a GitHub Actions secret named GIST_PAT.
  #   3. Flip `enabled: true` below and push.
  gist:
    enabled: false
    public: false                          # false = secret/unlisted (recommended)
    description: "Jira digest — {date}"    # shows on the gist page; {date} = today

# -----------------------------------------------------------------------------
# 6. RENDERING OPTIONS
# -----------------------------------------------------------------------------
rendering:
  # Truncate long summaries to this many characters.
  summary_max_chars: 80
  # Show a footer with run metadata (timestamp, repo link).
  show_footer: true
  # Brand color for HTML headings (hex).
  accent_color: "#0052CC"

# -----------------------------------------------------------------------------
# 7. SCHEDULE METADATA (for humans + the handoff prompt)
# -----------------------------------------------------------------------------
# The actual cron schedule lives in .github/workflows/digest.yml.
# This block records intent and is also referenced by failure notifications.
schedule:
  timezone: "UTC"
  local_time: "08:00"
  weekdays_only: true
  # Note: GitHub Actions cron can be delayed by 1–3 hours under load.
  # For tighter delivery, set up a cron-job.org task that hits the
  # repository_dispatch endpoint. See README §"Tightening the schedule".

# -----------------------------------------------------------------------------
# 8. FAILURE NOTIFICATION
# -----------------------------------------------------------------------------
# Fires when the script crashes OR when every enabled delivery channel errors,
# so you find out from the script and not from a confused colleague at 10am.
#
#   notify_via: none  | slack       | email
#   to:         (n/a) | Cxxx / Uxxx | an email address
#
# slack: reuses delivery.slack settings (token + via). Point `to` at your
#        Slack member ID (your DM) for highest reliability.
# email: reuses delivery.email settings (gmail/smtp). For gmail this is
#        ALWAYS sent immediately — failure drafts aren't useful.
on_failure:
  notify_via: none
  to: ""
